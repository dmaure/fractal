name: CI

# Guardia de CI del repo (SPEC-0031 T3 / FRA-45).
#
# Corre en cada pull request (y en push a master) y bloquea el merge si el mapa
# de progreso quedó desactualizado: `fractal status --check` regenera los
# diagramas de docs/MAPA_DE_PROGRESO.md en memoria y sale con código != 0 si no
# coinciden con lo que produciría `fractal status --write` desde
# docs/progress.json, o si faltan / están invertidos los marcadores de
# auto-generación. No escribe ningún archivo.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  progress-map-check:
    name: progress-map --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: fractal status --check
        run: pnpm status:check

  tests:
    name: tests + typecheck (todos los paquetes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Identidad git para que los tests que crean commits (git-initializer,
      # `fractal new`) no fallen con "Author identity unknown" en un runner limpio.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@fractal.local"
          git config --global user.name "Fractal CI"

      - name: Build packages
        run: pnpm -r build

      # Corre los tests de todos los paquetes. Tanto en `@fractal/core` como en
      # `@fractal/deploy` el script es `vitest run --typecheck.enabled`, por lo
      # que ambos también validan el typecheck de sus archivos de test.
      - name: Run package tests
        run: pnpm -r test

      - name: Run repo scripts tests
        run: pnpm test:scripts

      - name: Lint
        run: pnpm lint

      - name: Coupling lint (Artículo II)
        run: node scripts/lint-coupling.js

  e2e-laravel:
    name: E2E Laravel (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, sqlite3, pdo_sqlite
          tools: composer:v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run E2E tests
        run: cd packages/adapter-laravel && pnpm test src/e2e/laravel.test.ts
